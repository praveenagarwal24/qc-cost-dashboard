function matrixHTML(){
  const m=metricById(state.matrixMetric);
  const periods=periodsOf();
  const regs=activeRegions();

  /* region × period */
  const rVals=[];
  const rRows=regs.map(r=>{
    const vals=metricSeries("region",m,null,[r]);
    vals.forEach(v=>{ if(v!=null) rVals.push(v); });
    return { name:r, vals:vals };
  });
  const rMin=rVals.length?Math.min(...rVals):0, rMax=rVals.length?Math.max(...rVals):1;

  /* segment × period for the chosen cut */
  const sVals=[];
  const sRows=SEGMENTS.map(s=>{
    const vals=metricSeries(state.matrixLane,m,s.prefix);
    vals.forEach(v=>{ if(v!=null) sVals.push(v); });
    return { name:s.label, vals:vals };
  });
  const sMin=sVals.length?Math.min(...sVals):0, sMax=sVals.length?Math.max(...sVals):1;

  const head=first=>'<tr><th>'+esc(first)+'</th>'+periods.map(p=>'<th>'+esc(p)+'</th>').join("")+'</tr>';
  const body=(rows,min,max,clickAttr)=>rows.map(row=>
    '<tr'+(clickAttr?' class="clickable" data-drill="'+esc(row.name)+'" aria-selected="'+(state.drillRegion===row.name)+'"':'')+'>'+
    '<td style="font-weight:500">'+esc(row.name)+'</td>'+
    row.vals.map(v=>'<td><span class="heat num" style="'+heatStyle(m,v,min,max)+'">'+fmt(m,v)+'</span></td>').join("")+
    '</tr>').join("");

  return '<div class="sec"><h2>Drill down</h2><span class="note">Oldest period on the left. Colour runs red (worst) to green (best) within each grid.</span></div>'+
  '<div class="panel" style="margin-bottom:18px"><div class="panel-hd"><h3>Pick a metric to break apart</h3>'+
    '<div class="seg">'+metricsOf().map(x=>'<button data-mm="'+x.id+'" aria-pressed="'+(x.id===state.matrixMetric)+'">'+esc(x.label)+'</button>').join("")+'</div>'+
  '</div>'+
  '<div class="grid2">'+
    '<div><div class="panel-hd"><h3>By region</h3><span class="note">Click a row for its segment detail</span></div>'+
      '<div class="scroll"><table class="matrix">'+head("Region")+'<tbody>'+(rRows.length?body(rRows,rMin,rMax,true):'<tr><td colspan="'+(periods.length+1)+'" style="text-align:center;color:var(--muted);padding:24px">No regions selected</td></tr>')+'</tbody></table></div></div>'+
    '<div><div class="panel-hd"><h3>By segment</h3>'+
      '<div class="rec-tabs">'+lanesOf().map(l=>'<button data-ml="'+l.id+'" aria-pressed="'+(l.id===state.matrixLane)+'">'+esc(l.label)+'</button>').join("")+'</div></div>'+
      '<div class="scroll"><table class="matrix">'+head("Segment")+'<tbody>'+body(sRows,sMin,sMax,false)+'</tbody></table></div></div>'+
  '</div>'+
  drillHTML()+
  '</div>';
}

function drillHTML(){
  if(!state.drillRegion) return "";
  const periods=periodsOf();
  const rows=rowsFor("region").filter(r=>r.region===state.drillRegion);
  const byPeriod=new Map(rows.map(r=>[r.period,r]));
  let html='<div style="margin-top:18px;border-top:1px solid var(--hair-strong);padding-top:16px">'+
    '<div class="panel-hd"><h3>'+esc(state.drillRegion)+' \u2014 every metric, every segment</h3>'+
    '<button class="linky" id="drillClose">Close</button></div>'+
    '<div class="scroll"><table class="records"><tr><th>Segment</th><th>Metric</th>'+periods.map(p=>'<th>'+esc(p)+'</th>').join("")+'</tr><tbody>';
  SEGMENTS.forEach(s=>{
    metricsOf().forEach((m,mi)=>{
      html+='<tr>'+(mi===0?'<td rowspan="'+metricsOf().length+'" style="font-weight:600;vertical-align:top">'+esc(s.label)+'</td>':'')+
        '<td style="color:var(--ink-2)">'+esc(m.label)+'</td>'+
        periods.map(p=>{
          let v;
          if(m.src==="bq"){
            const i=periods.indexOf(p);
            v=metricSeries("region",m,s.prefix,[state.drillRegion])[i];
          } else { const r=byPeriod.get(p); v=r?valueAt(r,m,s.prefix):null; }
          return '<td class="num">'+fmt(m,v)+'</td>';
        }).join("")+'</tr>';
    });
  });
  return html+'</tbody></table></div></div>';
}

function recordFields(laneId){
  const rows=raw(laneId);
  const keys=new Set();
  rows.forEach(r=>Object.keys(r.v).forEach(k=>keys.add(k)));
  return [...keys];
}
function recordRows(){
  const laneId=state.recordsLane;
  const dim=(laneById(laneId)||{}).dim;
  let rows=raw(laneId).filter(r=>r.granularity===state.granularity);
  if(dim==="region") rows=rows.filter(r=>activeRegions().includes(r.region));
  const q=state.recordsQuery.trim().toLowerCase();
  if(q) rows=rows.filter(r=>(r.period+" "+(r.region||"")).toLowerCase().includes(q));
  rows.sort((a,b)=>{
    if(state.sortCol){
      const av=a.v[state.sortCol], bv=b.v[state.sortCol];
      if(av==null) return 1; if(bv==null) return -1;
      return (av-bv)*state.sortDir;
    }
    return -comparePeriods(a,b);
  });
  return rows;
}
function recordsHTML(){
  const laneId=state.recordsLane;
  const dim=(laneById(laneId)||{}).dim;
  const fields=recordFields(laneId);
  const rows=recordRows();
  const head='<tr><th>Period</th><th>Date</th>'+(dim?'<th>Region</th>':'')+
    fields.map(f=>'<th class="clickable" data-sort="'+esc(f)+'" style="cursor:pointer">'+esc(f)+
      (state.sortCol===f?(state.sortDir<0?" \u2193":" \u2191"):"")+'</th>').join("")+'</tr>';
  const body=rows.map(r=>'<tr><td style="font-weight:500">'+esc(r.period)+'</td>'+
    '<td class="num" style="color:var(--muted)">'+(r.date?r.date.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"}):"\u2014")+'</td>'+
    (dim?'<td>'+esc(r.region||"")+'</td>':'')+
    fields.map(f=>{
      const v=r.v[f];
      return '<td class="num">'+(v==null||isNaN(v)?"\u2014":(Math.abs(v)>=100?Math.round(v).toLocaleString("en-IN"):v.toFixed(2)))+'</td>';
    }).join("")+'</tr>').join("");

  return '<div class="sec"><h2>Records<span class="admin-tag">Admin</span></h2><span class="note">'+rows.length+' row'+(rows.length===1?"":"s")+
    ' from '+esc((laneById(laneId)||{}).sheet||"")+' \u00b7 sorted newest first unless you pick a column</span></div>'+
  '<div class="panel"><div class="panel-hd">'+
    '<div class="rec-tabs">'+lanesOf().map(l=>'<button data-rl="'+l.id+'" aria-pressed="'+(l.id===state.recordsLane)+'">'+esc(l.label)+'</button>').join("")+'</div>'+
    '<div class="ctl"><input class="search" id="recSearch" placeholder="Filter periods or regions" value="'+esc(state.recordsQuery)+'">'+
    '<button class="btn" id="csvBtn" style="background:var(--panel);border-color:var(--hair-strong);color:var(--ink-2)">Download CSV</button></div>'+
  '</div>'+
  '<div class="scroll"><table class="records">'+head+'<tbody>'+
    (rows.length?body:'<tr><td colspan="'+(fields.length+3)+'" style="text-align:center;color:var(--muted);padding:28px">Nothing matches that filter. Clear the search or pick more regions.</td></tr>')+
  '</tbody></table></div></div>';
}

/* ADMIN ONLY - what the sheets actually delivered, for spotting gaps at source. */
function healthHTML(){
  const ms=metricsOf(), cols=ms.filter(m=>m.agg!=="ratio").map(m=>m.id);
  const rows=lanesOf().map(l=>{
    const all=raw(l.id);
    let cells=0, blanks=0;
    all.forEach(r=>SEGMENTS.forEach(sg=>cols.forEach(c=>{
      cells++; const v=r.v[sg.prefix+c]; if(v==null||isNaN(v)) blanks++;
    })));
    const wk=all.filter(r=>r.granularity==="week").length;
    const mo=all.filter(r=>r.granularity==="month").length;
    const regs=l.dim==="region" ? new Set(all.map(r=>r.region)).size : "\u2014";
    return '<tr><td style="font-weight:500">'+esc(l.label)+'</td>'+
      '<td style="text-align:left;color:var(--muted)">'+esc(l.sheet)+'</td>'+
      '<td class="num">'+all.length+'</td><td class="num">'+wk+'</td><td class="num">'+mo+'</td>'+
      '<td class="num">'+regs+'</td>'+
      '<td class="num"'+(blanks?' style="color:var(--down);font-weight:600"':'')+'>'+
        blanks+(cells?' <span style="color:var(--muted);font-weight:400">of '+cells+'</span>':'')+'</td></tr>';
  }).join("");
  const acc = state.access
    ? state.access.length+' people in '+ACCESS_FILE+' \u00b7 '+
      state.access.filter(a=>a.role==="admin").length+' admin'
    : 'No '+ACCESS_FILE+' found \u2014 any '+ALLOWED_DOMAINS.join(" / ")+' address can sign in';
  let costDims="";
  if(state.cost){
    const seen={};
    state.cost.forEach(function(r){
      const k="seg:"+r.segment; seen[k]=seen[k]||{v:r.segment,kind:"segment",to:costSegmentOf(r.segment)};
      const g="reg:"+r.region;  seen[g]=seen[g]||{v:r.region,kind:"region",
        to:(allRegions().indexOf(r.region)>=0?r.region:null)};
    });
    const rows=Object.keys(seen).map(k=>seen[k]).map(function(d){
      return '<tr><td style="text-align:left">'+esc(d.kind)+'</td>'+
        '<td style="text-align:left">'+esc(d.v==null?"(blank)":d.v)+'</td>'+
        '<td style="text-align:left'+(d.to?'':';color:var(--down);font-weight:600')+'">'+
        (d.to?esc(d.to):"not mapped \u2014 excluded from that filter")+'</td></tr>';
    }).join("");
    costDims='<div class="sec"><h2>Cost dimensions<span class="admin-tag">Admin</span></h2>'+
      '<span class="note">What BigQuery returned, and how each value maps onto the filters. '+
      'Anything unmapped goes in segmentMap in config.json.</span></div>'+
      '<div class="panel"><div class="scroll"><table class="records">'+
      '<tr><th style="text-align:left">Field</th><th style="text-align:left">Value from BigQuery</th>'+
      '<th style="text-align:left">Maps to</th></tr><tbody>'+rows+'</tbody></table></div></div>';
  }
  return costDims+'<div class="sec"><h2>Data health<span class="admin-tag">Admin</span></h2>'+
    '<span class="note">What each sheet returned on the last sync. Blanks are missing metric cells, not zeros.</span></div>'+
    '<div class="panel" style="margin-bottom:18px"><div class="panel-hd" style="margin:0">'+
      '<h3>Access</h3><span class="note">'+esc(acc)+'</span></div></div>'+
    '<div class="panel"><div class="scroll" style="max-height:none"><table class="records">'+
    '<tr><th>Cut</th><th style="text-align:left">Sheet</th><th>Rows</th><th>Weekly</th><th>Monthly</th><th>Regions</th><th>Blank cells</th></tr>'+
    '<tbody>'+rows+'</tbody></table></div></div>';
}

/* ADMIN ONLY - who signed in and when. */
function loginLogHTML(){
  if(!LOGIN_LOG){
    return '<div class="sec"><h2>Sign-in log<span class="admin-tag">Admin</span></h2></div>'+
      '<div class="panel"><p style="margin:0;font-size:13px;color:var(--muted)">'+
      'Not set up yet \u2014 add a <code>loginLog</code> block to '+CONFIG_FILE+' pointing at a Google Form.'+
      '</p></div>';
  }
  const rows=state.loginLog;
  if(!rows) return '<div class="sec"><h2>Sign-in log<span class="admin-tag">Admin</span></h2></div>'+
    '<div class="panel"><p style="margin:0;font-size:13px;color:var(--muted)">'+
    'Couldn\u2019t read \u201c'+esc(LOGIN_LOG.sheetName||"")+'\u201d. Check the tab name and that the workbook is link-readable.</p></div>';

  const cut=Date.now()-7*864e5;
  const recent=rows.filter(r=>r.at && r.at.getTime()>=cut);
  const people=new Set(recent.map(r=>r.email));
  const body=rows.slice(0,60).map(r=>
    '<tr><td class="num" style="text-align:left">'+
      (r.at ? esc(r.at.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})) : "\u2014")+
    '</td><td style="text-align:left">'+esc(r.email)+'</td>'+
    '<td style="text-align:left;color:var(--muted)">'+esc(r.role||"\u2014")+'</td></tr>').join("");

  return '<div class="sec"><h2>Sign-in log<span class="admin-tag">Admin</span></h2>'+
    '<span class="note">'+recent.length+' sign-in'+(recent.length===1?"":"s")+' from '+people.size+
    ' '+(people.size===1?"person":"people")+' in the last 7 days \u00b7 showing the most recent '+
    Math.min(60,rows.length)+' of '+rows.length+'</span></div>'+
    '<div class="panel"><div class="scroll"><table class="records">'+
    '<tr><th style="text-align:left">When</th><th style="text-align:left">Account</th><th style="text-align:left">Role</th></tr>'+
    '<tbody>'+(body||'<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:24px">No sign-ins recorded yet</td></tr>')+
    '</tbody></table></div></div>';
}

function footHTML(){
  return '<div class="foot">'+
    '<span>Source: <a href="'+SHEET_URL+'" target="_blank" rel="noopener">Delivery Metrics workbook</a> \u2014 '+
      esc(lanesOf().map(l=>l.sheet).join(", "))+'</span>'+
    '<span>Percentages are 0\u2013100. TAT is in hours.</span>'+

/* ---------- events ---------- */
function wire(){
  const bqb=document.getElementById("bqBtn");
  if(bqb) bqb.onclick=async()=>{
    bqb.textContent="Connecting\u2026"; bqb.disabled=true;
    try{ BQ.token=await bqToken(true); state.costError=null; }
    catch(e){ state.costError="Sign-in for BigQuery didn\u2019t complete."; }
    state.cost=await loadCost();
    render();
  };
  document.querySelectorAll("[data-chart]").forEach(b=>b.onclick=()=>{ state.chart=b.dataset.chart; render(); });
  document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{ state.scale=b.dataset.scale; render(); });
  document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.card;
    if(state.hiddenCards.has(id)) state.hiddenCards.delete(id); else state.hiddenCards.add(id);
    render();
  });
  document.querySelectorAll("[data-gran]").forEach(b=>b.onclick=()=>{ state.granularity=b.dataset.gran; render(); });
  document.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{ state.segment=b.dataset.seg; render(); });
  document.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.region;
    if(regSet().has(r)) regSet().delete(r); else regSet().add(r);
    if(state.drillRegion&&!regSet().has(state.drillRegion)) state.drillRegion=null;
    render();
  });
  const ra=document.getElementById("regAll");
  if(ra) ra.onclick=()=>{
    const all=allRegions();
    if(regSet().size===all.length) regSet().clear(); else all.forEach(r=>regSet().add(r));
    render();
  };
  document.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{ state.trendMetric=b.dataset.tm; render(); });
  document.querySelectorAll("[data-split]").forEach(b=>b.onclick=()=>{ state.trendSplit=b.dataset.split; state.hidden.clear(); render(); });
  document.querySelectorAll("[data-cmode]").forEach(b=>b.onclick=()=>{ state.colorMode=b.dataset.cmode; render(); });
  document.querySelectorAll("[data-series]").forEach(b=>b.onclick=()=>{
    const n=b.dataset.series;
    if(state.hidden.has(n)) state.hidden.delete(n); else state.hidden.add(n);
    render();
  });
  document.querySelectorAll("[data-mm]").forEach(b=>b.onclick=()=>{ state.matrixMetric=b.dataset.mm; render(); });
  document.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{ state.matrixLane=b.dataset.ml; render(); });
  document.querySelectorAll("[data-rl]").forEach(b=>b.onclick=()=>{ state.recordsLane=b.dataset.rl; state.sortCol=null; render(); });
  document.querySelectorAll("[data-drill]").forEach(tr=>tr.onclick=()=>{
    state.drillRegion = state.drillRegion===tr.dataset.drill ? null : tr.dataset.drill; render();
  });
  const dc=document.getElementById("drillClose");
  if(dc) dc.onclick=(e)=>{ e.stopPropagation(); state.drillRegion=null; render(); };
  document.querySelectorAll("[data-sort]").forEach(th=>th.onclick=()=>{
    const f=th.dataset.sort;
    if(state.sortCol===f) state.sortDir*=-1; else { state.sortCol=f; state.sortDir=-1; }
    render();
  });
  const rs=document.getElementById("recSearch");
  if(rs) rs.oninput=()=>{
    state.recordsQuery=rs.value;
    const at=rs.selectionStart; render();
    const el=document.getElementById("recSearch");
    if(el){ el.focus(); el.setSelectionRange(at,at); }
  };
  const csv=document.getElementById("csvBtn");
  if(csv) csv.onclick=downloadCSV;

  /* chart tooltips */
  const tip=document.getElementById("tip");
  document.querySelectorAll(".pt").forEach(c=>{
    c.addEventListener("mouseenter",e=>{
      tip.innerHTML="<b>"+c.dataset.v+"</b> \u00b7 "+c.dataset.label+"<br>"+c.dataset.x;
      tip.style.opacity="1";
    });
    c.addEventListener("mousemove",e=>{
      tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY-46)+"px";
    });
    c.addEventListener("mouseleave",()=>{ tip.style.opacity="0"; });
  });
}

function downloadCSV(){
  const laneId=state.recordsLane, dim=(laneById(laneId)||{}).dim;
  const fields=recordFields(laneId), rows=recordRows();
  const head=["period","date"].concat(dim?["region"]:[]).concat(fields);
  const lines=[head.join(",")].concat(rows.map(r=>{
    const base=[r.period, r.date?r.date.toISOString().slice(0,10):""].concat(dim?[r.region||""]:[]);
    return base.concat(fields.map(f=>r.v[f]==null?"":r.v[f])).map(c=>{
      const s=String(c);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",");
  }));
  const blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=laneId+"_"+state.granularity+"_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById("refreshBtn").onclick=loadAll;
/* The masthead condenses once you scroll so the frozen bar stays slim. */
/* Collapsing the header shortens the page, which can scroll you back above the
   trigger and expand it again - hence the gap between the two thresholds. */
let mastCompact=false, stickyQueued=false;
window.addEventListener("scroll",function(){
  const y=window.scrollY;
  if(!mastCompact && y>90) mastCompact=true;
  else if(mastCompact && y<30) mastCompact=false;
  else return;
  const m=document.querySelector(".mast");
  if(!m) return;
  m.classList.toggle("compact",mastCompact);
  if(!stickyQueued){
    stickyQueued=true;
    requestAnimationFrame(function(){ stickyQueued=false; syncSticky(); });
  }
},{passive:true});
window.addEventListener("resize",syncSticky);
syncSticky();
loadConfig().then(function(){ if(restoreSession()) showApp(); else showGate(); });
</script>
